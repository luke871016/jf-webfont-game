    </section>

    <!-- 開始畫面 -->
    <section class="screen screen-start" id="screenStart">
      <p class="eyebrow">justfont 字型挑戰</p>
      <h1 class="title drechifont" id="gameTitle"><span class="title-brand">justfont</span><span id="titleText">字體辨識大師</span></h1>
      <p class="subtitle">選一個模式，考考你對 justfont 字體的眼力！</p>

      <h2 class="section-label">選擇模式</h2>
      <div class="modes" role="radiogroup" aria-label="遊戲模式">
        <button type="button" class="mode-card selected" data-mode="featured" role="radio" aria-checked="true">
          <span class="mode-glyphs" aria-hidden="true"><span class="jf-lanyangming-regular">字</span><span class="jf-kamabit">字</span><span class="burnfont">字</span></span>
          <span class="mode-name">精選字體辨識</span>
          <span class="mode-desc">辨識 justfont 官網 14 套精選字體</span>
        </button>
        <button type="button" class="mode-card" data-mode="handwriting" role="radio" aria-checked="false">
          <span class="mode-glyphs" aria-hidden="true"><span class="drechifont">字</span><span class="jf-sunday">字</span><span class="xionggu">字</span></span>
          <span class="mode-name">手寫字體辨識</span>
          <span class="mode-desc">看一句話，猜出是哪一款手寫字</span>
        </button>
        <button type="button" class="mode-card" data-mode="weight" role="radio" aria-checked="false">
          <span class="mode-glyphs" aria-hidden="true"><span class="jf-jinxuan-ultralight">字</span><span class="jf-jinxuan-medium">字</span><span class="jf-jinxuan-heavy">字</span></span>
          <span class="mode-name">字重辨識大師</span>
          <span class="mode-desc">同一套字體，猜出是哪一個字重</span>
        </button>
        <button type="button" class="mode-card" data-mode="taiwanese" role="radio" aria-checked="false">
          <span class="mode-glyphs" aria-hidden="true"><span class="jf-bunguan">台</span><span class="twroadfont">文</span><span class="amafont">字</span></span>
          <span class="mode-name">台文字體辨識</span>
          <span class="mode-desc">辨識 18 套支援台文的 justfont 字體</span>
        </button>
      </div>

      <h2 class="section-label">選擇難度</h2>
      <div class="difficulty" role="radiogroup" aria-label="難度">
        <button type="button" class="diff-btn" data-diff="easy">
          <span class="diff-name">輕鬆</span><span class="diff-desc"></span>
        </button>
        <button type="button" class="diff-btn selected" data-diff="normal">
          <span class="diff-name">標準</span><span class="diff-desc"></span>
        </button>
        <button type="button" class="diff-btn" data-diff="master">
          <span class="diff-name">大師</span><span class="diff-desc"></span>
        </button>
      </div>

      <button type="button" class="btn btn-primary" id="startBtn">開始挑戰</button>
      <p class="best" id="bestScore"></p>

      <details class="rules">
        <summary>遊戲規則</summary>
        <ul id="rulesList">
          <li>先選擇模式與難度，一局共 10 題，每題從四個選項中選出正確答案。</li>
          <li class="rule-shared">答對得 100 分，再加上剩餘時間獎勵（最多 +100）。</li>
          <li>連續答對有連擊加成，每多連擊一次再 +20 分！</li>
          <li>可以用鍵盤 <kbd>1</kbd>～<kbd>4</kbd> 作答，<kbd>Enter</kbd> 進入下一題。</li>
        </ul>
      </details>
    </section>

    <!-- 遊戲畫面 -->
    <section class="screen screen-game" id="screenGame">
      <header class="hud">
        <div class="hud-item"><span class="hud-label">題目</span><span class="hud-value" id="hudRound">1 / 10</span></div>
        <div class="hud-item"><span class="hud-label">分數</span><span class="hud-value" id="hudScore">0</span></div>
        <div class="hud-item"><span class="hud-label">連擊</span><span class="hud-value" id="hudCombo">0</span></div>
      </header>

      <div class="timer"><div class="timer-bar" id="timerBar"></div></div>

      <div class="paper">
        <p class="paper-hint" id="paperHint">這是哪一款字體？</p>
        <p class="sample" id="sample"></p>
      </div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn btn-primary next-btn" id="nextBtn" hidden>下一題 ⏎</button>
    </section>

    <!-- 結算畫面 -->
    <section class="screen screen-result" id="screenResult">
      <p class="eyebrow" id="resultMode">挑戰結束</p>
      <h2 class="rank drechifont" id="rankTitle"></h2>
      <p class="rank-desc" id="rankDesc"></p>

      <div class="stats">
        <div class="stat"><span class="stat-value" id="statScore">0</span><span class="stat-label">總分</span></div>
        <div class="stat"><span class="stat-value" id="statCorrect">0</span><span class="stat-label">答對題數</span></div>
        <div class="stat"><span class="stat-value" id="statSpeed">-</span><span class="stat-label">平均答對秒數</span></div>
        <div class="stat"><span class="stat-value" id="statCombo">0</span><span class="stat-label">最高連擊</span></div>
      </div>
      <p class="new-best" id="newBest" hidden>🎉 刷新個人最佳紀錄！</p>

      <div class="result-actions">
        <button type="button" class="btn btn-primary" id="retryBtn">再玩一次</button>
        <button type="button" class="btn" id="homeBtn">回首頁</button>
        <button type="button" class="btn" id="shareBtn">複製成績</button>
      </div>

      <h3 class="review-title">本局回顧</h3>
      <ol class="review" id="review"></ol>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="game.js?v=20261001-9"></script>
</body>
</html>
